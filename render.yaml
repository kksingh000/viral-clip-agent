# =============================================================================
# Render blueprint.
#
# Deploy with: New > Blueprint, point it at this repository.
#
# READ THIS FIRST -- two things differ from docker-compose and both matter:
#
# 1. OBJECT STORAGE IS REQUIRED. A Render disk attaches to exactly one
#    service, so the API and the workers cannot share one the way they share
#    the `media-data` volume locally. Set STORAGE_PROVIDER=s3 and point it at
#    S3, Cloudflare R2, Backblaze B2 or any S3-compatible bucket. With
#    STORAGE_PROVIDER=local the API would write clips the worker cannot read,
#    and every download would 404.
#
# 2. BACKGROUND WORKERS ARE NOT ON THE FREE TIER, and free web services sleep
#    after inactivity. This blueprint therefore uses paid instance types. See
#    docs/deploy-render.md for the cost breakdown and how to trim it.
#
# Secrets are declared `sync: false`: Render prompts for them once at deploy
# and stores them itself. Nothing secret belongs in this file.
# =============================================================================

databases:
  - name: viralagent-db
    databaseName: viralagent
    user: viralagent
    plan: basic-256mb
    postgresMajorVersion: "16"
    # pgvector ships with Render Postgres; enable it with
    #   CREATE EXTENSION IF NOT EXISTS vector;
    # The Alembic env does this automatically when it has permission.

services:
  # ---------------------------------------------------------------- broker
  - type: keyvalue
    name: viralagent-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction # never drop a queued job
    ipAllowList: [] # reachable only from inside the Render network

  # ------------------------------------------------------------------- API
  - type: web
    name: viralagent-api
    runtime: docker
    repo: https://github.com/kksingh000/viral-clip-agent
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    # Schema changes land before any new instance serves traffic.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true # Render generates and stores it
      - key: DATABASE_URL
        fromDatabase:
          name: viralagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: viralagent-redis
          property: connectionString
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # ---- object storage (REQUIRED: see the note at the top) -------------
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL # blank for AWS; set for R2/B2/MinIO
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # ---- providers -------------------------------------------------------
      # Defaults are the honest no-credential mode: the pipeline runs, agents
      # use deterministic fallbacks, and /health reports `degraded` rather
      # than pretending. Switch these on once you have keys.
      - key: LLM_PROVIDER
        value: mock # -> anthropic | openai
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: mock # -> openai (light) | faster_whisper (needs >=2GB worker)
      - key: YOUTUBE_API_KEY
        sync: false
      # ---- CORS: must list the frontend's exact origin ---------------------
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: viralagent-web
          property: host
          # `host` is a bare hostname; the API promotes it to https://
          # automatically (see Settings._normalise_origins).
      - key: RATE_LIMIT_ENABLED
        value: "true"

  # ---------------------------------------------------------------- worker
  # Standard (2 GB) rather than Starter: ffmpeg rendering is memory-hungry,
  # and faster_whisper needs ~1 GB for the base model on top of that.
  - type: worker
    name: viralagent-worker
    runtime: docker
    repo: https://github.com/kksingh000/viral-clip-agent
    region: oregon
    plan: standard
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Must match the API: tokens signed by one are verified by the other.
      - key: SECRET_KEY
        fromService:
          type: web
          name: viralagent-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: viralagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: viralagent-redis
          property: connectionString
      - key: LOG_JSON
        value: "true"
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: mock
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: YOUTUBE_API_KEY
        sync: false
      # Scratch space for ffmpeg. Ephemeral by design -- everything durable
      # goes to object storage.
      - key: WORKDIR
        value: /data/work

  # -------------------------------------------------------------- scheduler
  # Exactly one instance, always. A second `beat` duplicates every scheduled
  # job, so this service must never be scaled above 1.
  - type: worker
    name: viralagent-beat
    runtime: docker
    repo: https://github.com/kksingh000/viral-clip-agent
    region: oregon
    plan: starter
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    dockerCommand: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: viralagent-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: viralagent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: viralagent-redis
          property: connectionString
      - key: LOG_JSON
        value: "true"

  # -------------------------------------------------------------- dashboard
  - type: web
    name: viralagent-web
    runtime: docker
    repo: https://github.com/kksingh000/viral-clip-agent
    region: oregon
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # Resolved per request by the root layout, not baked into the bundle --
      # which is what lets this image be built before the API's URL is known.
      - key: API_URL
        fromService:
          type: web
          name: viralagent-api
          property: host
          # Bare hostname again; the client promotes it to https://.
      - key: NODE_ENV
        value: production
